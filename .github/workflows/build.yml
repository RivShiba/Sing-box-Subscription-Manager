name: Build OpenWrt Packages

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build_ipk:
    name: Compile IPK (OpenWrt 23.05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: luci-app-mysub

      - name: Cache OpenWrt 23.05 SDK
        id: cache_ipk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-23.05.4

      - name: Download & extract SDK
        if: steps.cache_ipk.outputs.cache-hit != 'true'
        run: |
          wget -q https://downloads.openwrt.org/releases/23.05.4/targets/x86/64/openwrt-sdk-23.05.4-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz -O sdk.tar.xz
          tar xf sdk.tar.xz
          mv openwrt-sdk-* sdk
          mkdir -p sdk/package/luci-app-mysub

      - name: Copy package into SDK
        run: |
          rm -rf sdk/package/luci-app-mysub
          cp -r luci-app-mysub sdk/package/

      - name: Compile IPK
        run: |
          cd sdk
          make defconfig
          make package/luci-app-mysub/compile V=s

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mysub-ipk
          path: sdk/bin/packages/**/luci-app-mysub*

  build_apk:
    name: Compile APK (OpenWrt 25.12.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: luci-app-mysub

      - name: Cache OpenWrt 25.12.4 SDK
        id: cache_apk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-25.12.4

      - name: Download & extract SDK
        if: steps.cache_apk.outputs.cache-hit != 'true'
        run: |
          wget -q https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/sha256sums -O sha256sums
          SDK_FILE=$(grep 'openwrt-sdk' sha256sums | awk '{print $2}' | sed 's/*//')
          wget -q https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/$SDK_FILE -O sdk_archive.tar.xz
          tar xf sdk_archive.tar.xz
          mv openwrt-sdk-* sdk
          mkdir -p sdk/package/luci-app-mysub

      - name: Copy package into SDK
        run: |
          rm -rf sdk/package/luci-app-mysub
          cp -r luci-app-mysub sdk/package/

      - name: Compile APK
        run: |
          cd sdk
          make defconfig
          make package/luci-app-mysub/compile V=s

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mysub-apk
          path: sdk/bin/packages/**/luci-app-mysub*

  publish:
    name: Publish to GitHub Release
    needs: [build_ipk, build_apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
                  # Удаляем предыдущий релиз с этим тегом (если есть), чтобы
                  # повторный запуск не падал с "already exists".
                  gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true
                  gh release create "$TAG" \
                    dist/luci-app-mysub-ipk/* \
                    dist/luci-app-mysub-apk/* \
                    --repo "${{ github.repository }}" \
                    --title "luci-app-mysub $TAG" \
                    --generate-notes